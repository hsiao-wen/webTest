<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Neon Button</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .neon-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
        }

        .neon-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: conic-gradient(
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    rgb(0, 0, 0),
                    violet,
                    rgb(96, 96, 255),
                    rgb(0, 182, 182),
                    rgb(0, 184, 0),
                    rgb(255, 208, 0),
                    orange,
                    red
                    );
            filter: blur(30px);
            z-index: 0;
            animation: rotate 3s linear infinite;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .neon-wrapper:hover .neon-glow {
            opacity: 1;
            animation: rotate 3s linear infinite;
        }

        /* .neon-glow:hover {
            opacity: 1;
            animation: rotate 3s linear infinite;
        } */

        .neon-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: none;
            border-radius: 8px;
            background: #111;
            z-index: 1;
            cursor: pointer;
            box-shadow: 0px 0px 4px 4px #ffffff25;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="neon-wrapper">
        <div class="neon-glow"></div>
        <button class="neon-button"></button>
    </div>
</body>

</html>
