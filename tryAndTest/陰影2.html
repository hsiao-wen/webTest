<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 100px;
            line-height: 20vmin;
        }

        .gradient-text {
            color: transparent;
            background: conic-gradient(#D9D7F1 0 12%,
                    #BAABDA 12% 33%,
                    #E7FBBE 33% 55%,
                    #FFCBCB 55% 70%,
                    #B5DEFF 70% 87%,
                    #F7D1BA 87% 100%);
            background-size: 30%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: expand-rev 8s ease-in-out infinite;
        }

        @keyframes expand-rev {

            0%,
            100% {
                background-position: left top;
            }

            25% {
                background-position: right bottom;
            }

            50% {
                background-position: left bottom;
            }

            75% {
                background-position: right top;
            }
        }
    </style>
</head>

<body>
    <h1 class="gradient-text">OAO人OwO<h1>
</body>

</html>
