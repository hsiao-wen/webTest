<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Garmin Job Requirement CSV 轉換 Excel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-primary">Garmin Job Requirement CSV 轉換 Excel (.xls)</h2>

        <div class="card shadow-sm p-4 mb-4">
            <div class="mb-3">
                <label class="form-label">上傳 CSV 檔案 1</label>
                <input type="file" id="file1" class="form-control" accept=".csv">
            </div>
            <div class="mb-3">
                <label class="form-label">上傳 CSV 檔案 2</label>
                <input type="file" id="file2" class="form-control" accept=".csv">
            </div>
            <div class="mb-3">
                <label class="form-label">上傳 CSV 檔案 3</label>
                <input type="file" id="file3" class="form-control" accept=".csv">
            </div>
            <div class="mb-3">
                <label class="form-label">上傳 CSV 檔案 4</label>
                <input type="file" id="file4" class="form-control" accept=".csv">
            </div>
            <button id="convertBtn" class="btn btn-success w-100">轉換</button>
        </div>

        <div id="downloadArea" class="mt-4"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const headers = ["Org Code", "Buyer", " 廠商", " 料號", " DESC", "交貨日期", " 類別", "線別", " 工單", "數量", " 批次", "STS", " STS_Rev", "工單時間"];

        async function readBig5(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const decoder = new TextDecoder("big5"); // Big5 解碼
                    const text = decoder.decode(reader.result);
                    resolve(text);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const files = [file1.files[0], file2.files[0], file3.files[0], file4.files[0]].filter(f => f);
            const allRows = [];

            for (const file of files) {
                const text = await readBig5(file);
                const rows = text.split(/\r?\n/).map(r => r.split(','));
                rows.slice(1).forEach(row => {
                    if (row.length > 5 && row[5].trim() !== "") {
                        allRows.push(row);
                    }
                });
            }

            const groups = {};
            allRows.forEach(row => {
                const date = row[5].trim();
                if (!groups[date]) groups[date] = [];
                groups[date].push(row);
            });

            const downloadArea = document.getElementById('downloadArea');
            downloadArea.innerHTML = '';

            const totalFiles = Object.keys(groups).length;
            if (totalFiles > 0) {
                const alert = document.createElement('div');
                alert.className = 'alert alert-info';
                alert.textContent = `共產生 ${totalFiles} 個檔案：`;
                downloadArea.appendChild(alert);
            }

            Object.keys(groups).sort().forEach(date => {
                const ws = XLSX.utils.aoa_to_sheet([headers, ...groups[date]]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
                const wbout = XLSX.write(wb, { bookType: 'xls', type: 'array' });
                const blob = new Blob([wbout], { type: "application/vnd.ms-excel" });
                const url = URL.createObjectURL(blob);

                const filename = `${date}_Garmin_Job_Requirement.xls`;
                const btn = document.createElement('a');
                btn.href = url;
                btn.download = filename;
                btn.textContent = filename;
                btn.className = 'btn btn-outline-primary d-block mb-2';
                downloadArea.appendChild(btn);
            });
        });
    </script>
</body>

</html>
