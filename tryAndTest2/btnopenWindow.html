<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開新視窗範例</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            background-color: #4285f4;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #357ae8;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- 關鍵就在 onclick 中的 window.open(網址, '_blank')，這會指示瀏覽器在新分頁/視窗打開鏈結 -->
    <button class="btn" onclick="window.open('http://127.0.0.1:8082/tryAndTest2/btnCloseWindow.html', '_blank')">
        開新視窗範例
    </button>

</body>
</html>
