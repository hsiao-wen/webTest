<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add iFrame Alert</title>
</head>
<body>
    <h1>添加 iFrame Alert 測試</h1>
    <button onclick="addframealert()">點擊添加 iFrame Alert</button>
    
    <script>
        function addframealert() {
            // 創建 <frame> 元素
            const frame = document.createElement('iframe');
            frame.style.margin = "0px 2px";
            frame.style.width = "5px";
            frame.style.height = "5px";
            frame.style.border = "1px solid black";
            
            // 設置 <iframe> 的內容
            const frameContent = `
                <html>
                <head><\/head>
                <body>
                    <script>
					//setTimeout(() => {
                        alert('這是插入的 Frame 彈窗');
					//}, 200)
                    <\/script>
                <\/body>
                <\/html>
            `;
            
            // 加載內容到 <iframe>
            frame.srcdoc = frameContent;

            // 插入 <iframe> 到文檔結尾
            document.body.appendChild(frame);
        }
    </script>
</body>
</html>
